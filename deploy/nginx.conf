# Блок nginx для портфолио на том же VPS, что и usermanagementapp.com.
# Установка (замените example.com на свой домен):
#   sudo cp nginx.conf /etc/nginx/sites-available/example.com
#   sudo ln -s /etc/nginx/sites-available/example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d www.example.com
server {
    listen 80;
    server_name example.com www.example.com;

    root /var/www/example.com;
    index index.html;

    # www -> без www
    if ($host = www.example.com) {
        return 301 https://example.com$request_uri;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Файлы сборки содержат хеш в имени — кешируем надолго
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
