# nginx server block for the portfolio on the same VPS as usermanagementapp.com.
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/davydovdenis.de
#   sudo ln -s /etc/nginx/sites-available/davydovdenis.de /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d davydovdenis.de -d www.davydovdenis.de
#
# Password-protect the site if needed:
#   sudo apt install -y apache2-utils && sudo htpasswd -c /etc/nginx/.htpasswd-portfolio denis
#   and add to server: auth_basic "preview"; auth_basic_user_file /etc/nginx/.htpasswd-portfolio;
server {
    listen 80;
    server_name davydovdenis.de www.davydovdenis.de;

    root /var/www/davydovdenis.de;
    index index.html;

    # Browsers revalidate pages on every visit: otherwise Safari keeps old HTML
    # that points to deleted stylesheets and the site renders unstyled
    location / {
        expires -1;
        try_files $uri $uri/ $uri.html =404;
    }

    # Build files have a hash in their name — cache them for long
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
