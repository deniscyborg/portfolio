# Блок nginx для портфолио на том же VPS, что и usermanagementapp.com.
# Установка:
#   sudo cp nginx.conf /etc/nginx/sites-available/davydovdenis.de
#   sudo ln -s /etc/nginx/sites-available/davydovdenis.de /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d davydovdenis.de -d www.davydovdenis.de
#
# Закрыть сайт паролем при необходимости:
#   sudo apt install -y apache2-utils && sudo htpasswd -c /etc/nginx/.htpasswd-portfolio denis
#   и добавить в server: auth_basic "preview"; auth_basic_user_file /etc/nginx/.htpasswd-portfolio;
server {
    listen 80;
    server_name davydovdenis.de www.davydovdenis.de;

    root /var/www/davydovdenis.de;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Файлы сборки содержат хеш в имени — кешируем надолго
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
